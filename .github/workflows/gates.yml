name: guardrails
on: pull_request

jobs:
  gates:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '22.11.0'
      - name: Install gitleaks
        run: |
          curl -sSL -O https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          curl -sSL -O https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_checksums.txt
          grep "gitleaks_8.30.1_linux_x64.tar.gz" gitleaks_8.30.1_checksums.txt | sha256sum -c -
          tar -xzf gitleaks_8.30.1_linux_x64.tar.gz gitleaks
          chmod +x gitleaks
          sudo mv gitleaks /usr/local/bin/gitleaks
      - name: Install osv-scanner
        run: |
          curl -sSL -O https://github.com/google/osv-scanner/releases/download/v2.6.0/osv-scanner_linux_amd64
          curl -sSL -O https://github.com/google/osv-scanner/releases/download/v2.6.0/osv-scanner_SHA256SUMS
          grep "osv-scanner_linux_amd64$" osv-scanner_SHA256SUMS | sha256sum -c -
          chmod +x osv-scanner_linux_amd64
          sudo mv osv-scanner_linux_amd64 /usr/local/bin/osv-scanner
      - id: conductor
        timeout-minutes: 5
        uses: vaultcompasshq/conductor@b0b675a48e7f0e38efc54ec80861b3bafbfcd14f # v0.6.0
        with:
          pr-comment: true

  hygiene:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '22.11.0'
      - run: pnpm lint
